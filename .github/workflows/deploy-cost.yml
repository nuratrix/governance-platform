# ─────────────────────────────────────────────────────────────────────────────
# .github/workflows/deploy-cost.yml
# Deploys the Cost Agent.
# Triggers on changes to agents/cost/ or shared/.
#
# Required GitHub Secrets:
#   AWS_DEPLOY_ROLE_ARN  — OIDC role ARN in the governance account
#   TF_STATE_BUCKET      — S3 bucket holding all Terraform state files
#
# Optional GitHub Variables (per customer environment):
#   ENABLED_AGENTS       — comma-separated list of enabled agents.
#                          If set and does not include 'cost', this workflow skips.
#                          Leave unset or set to 'all' to always deploy.
# ─────────────────────────────────────────────────────────────────────────────
name: Deploy Cost Agent

on:
  push:
    branches: [main]
    paths:
      - 'agents/cost/**'
      - 'shared/**'

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    name: Terraform Apply — Cost Agent
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Check agent is enabled for this customer
        id: gate
        run: |
          ENABLED="${{ vars.ENABLED_AGENTS }}"
          if [ -n "$ENABLED" ] && [ "$ENABLED" != "all" ]; then
            if ! echo "$ENABLED" | grep -q "cost"; then
              echo "enabled=false" >> $GITHUB_OUTPUT
            else
              echo "enabled=true" >> $GITHUB_OUTPUT
            fi
          else
            echo "enabled=true" >> $GITHUB_OUTPUT
          fi

      - name: Copy shared lambdas
        if: steps.gate.outputs.enabled == 'true'
        run: cp shared/*.py agents/cost/lambdas/

      - name: Configure AWS credentials via OIDC
        if: steps.gate.outputs.enabled == 'true'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: us-east-1

      - name: Setup Terraform
        if: steps.gate.outputs.enabled == 'true'
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.11.0

      - name: Create build directory
        if: steps.gate.outputs.enabled == 'true'
        run: mkdir -p agents/cost/terraform/.build

      - name: Terraform Init
        if: steps.gate.outputs.enabled == 'true'
        run: |
          terraform -chdir=agents/cost/terraform init -reconfigure \
            -backend-config="bucket=${{ secrets.TF_STATE_BUCKET }}" \
            -backend-config="key=agents/cost/terraform.tfstate" \
            -backend-config="region=us-east-1"

      - name: Terraform Plan
        if: steps.gate.outputs.enabled == 'true'
        run: |
          terraform -chdir=agents/cost/terraform plan \
            -var="platform_state_bucket=${{ secrets.TF_STATE_BUCKET }}" \
            -out=cost.tfplan

      - name: Terraform Apply
        if: steps.gate.outputs.enabled == 'true'
        run: terraform -chdir=agents/cost/terraform apply -auto-approve cost.tfplan

      - name: Capture outputs
        if: steps.gate.outputs.enabled == 'true'
        id: tf_outputs
        run: |
          AGENT_ID=$(terraform -chdir=agents/cost/terraform output -raw agent_id)
          ALIAS_ID=$(terraform -chdir=agents/cost/terraform output -raw agent_alias_id)
          echo "agent_id=$AGENT_ID"       >> $GITHUB_OUTPUT
          echo "agent_alias_id=$ALIAS_ID" >> $GITHUB_OUTPUT

      - name: Print deployment summary
        if: steps.gate.outputs.enabled == 'true'
        run: |
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "  Cost Agent deployed successfully ✅"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo ""
          echo "  Agent ID:       ${{ steps.tf_outputs.outputs.agent_id }}"
          echo "  Agent Alias ID: ${{ steps.tf_outputs.outputs.agent_alias_id }}"
          echo ""
          echo "  Add these to GitHub Secrets before deploying the Orchestrator:"
          echo "    COST_AGENT_ID         = ${{ steps.tf_outputs.outputs.agent_id }}"
          echo "    COST_AGENT_ALIAS_ID   = ${{ steps.tf_outputs.outputs.agent_alias_id }}"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"

      - name: Agent skipped
        if: steps.gate.outputs.enabled != 'true'
        run: echo "ℹ️  Cost Agent skipped — not included in ENABLED_AGENTS ('${{ vars.ENABLED_AGENTS }}')"
