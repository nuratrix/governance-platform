# ─────────────────────────────────────────────────────────────────────────────
# .github/workflows/deploy-platform.yml
# Deploys shared platform infrastructure (DynamoDB, SNS, Organizations data
# sources, account_registry table, OIDC role).
# Must run before any agent workflow.
#
# Required GitHub Secrets:
#   AWS_DEPLOY_ROLE_ARN  — OIDC role ARN in the governance account
#   TF_STATE_BUCKET      — S3 bucket holding all Terraform state files
#   ALERT_EMAIL          — e-mail address for SNS alert subscription
# ─────────────────────────────────────────────────────────────────────────────
name: Deploy Platform

on:
  push:
    branches: [main]
    paths:
      - 'platform/**'
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    name: Terraform Apply — Platform
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: us-east-1

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.11.0

      - name: Create build directory
        run: mkdir -p platform/terraform/.build

      - name: Terraform Init
        run: |
          terraform -chdir=platform/terraform init -reconfigure \
            -backend-config="bucket=${{ secrets.TF_STATE_BUCKET }}" \
            -backend-config="key=platform/terraform.tfstate" \
            -backend-config="region=us-east-1"

      - name: Import existing resources into state
        env:
          TF_VAR_alert_email: ${{ secrets.ALERT_EMAIL }}
          TF_VAR_platform_state_bucket: ${{ secrets.TF_STATE_BUCKET }}
        run: |
          set -euo pipefail

          tf_import() {
            local resource=$1 id=$2 label=$3
            # state list doesn't need variable values — safe check against state file
            if terraform -chdir=platform/terraform state list 2>/dev/null | grep -qF "$resource"; then
              echo "✓ $label already in Terraform state — skipping"
            else
              echo "→ Importing $label ($id) into Terraform state..."
              terraform -chdir=platform/terraform import "$resource" "$id"
              echo "✓ $label imported"
            fi
          }

          ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)

          # DynamoDB account registry
          TABLE="governance-platform-account-registry"
          if aws dynamodb describe-table --table-name "$TABLE" --query 'Table.TableName' --output text > /dev/null 2>&1; then
            tf_import aws_dynamodb_table.account_registry "$TABLE" "account registry table"
          fi

          # CloudFront OAC
          OAC_NAME="governance-platform-dashboard-oac"
          OAC_ID=$(aws cloudfront list-origin-access-controls \
            --query "OriginAccessControlList.Items[?Name=='${OAC_NAME}'].Id" \
            --output text)
          if [ -n "$OAC_ID" ]; then
            tf_import aws_cloudfront_origin_access_control.dashboard "$OAC_ID" "CloudFront OAC"
          fi

          # Dashboard S3 bucket
          DASHBOARD_BUCKET="governance-platform-dashboard-${ACCOUNT_ID}"
          if aws s3api head-bucket --bucket "$DASHBOARD_BUCKET" > /dev/null 2>&1; then
            tf_import aws_s3_bucket.dashboard "$DASHBOARD_BUCKET" "dashboard S3 bucket"
          fi

      - name: Terraform Plan
        run: |
          terraform -chdir=platform/terraform plan \
            -var="alert_email=${{ secrets.ALERT_EMAIL }}" \
            -var="platform_state_bucket=${{ secrets.TF_STATE_BUCKET }}" \
            -out=platform.tfplan

      - name: Terraform Apply
        run: terraform -chdir=platform/terraform apply -auto-approve platform.tfplan
