# ─────────────────────────────────────────────────────────────────────────────
# .github/workflows/deploy-platform.yml
# Deploys shared platform infrastructure (DynamoDB, SNS, Organizations data
# sources, account_registry table, OIDC role).
# Must run before any agent workflow.
#
# Required GitHub Environment variables (set in the selected environment):
#   AWS_DEPLOY_ROLE_ARN  — OIDC role ARN in the governance account
#   TF_STATE_BUCKET      — S3 bucket holding all Terraform state files
#   ALERT_EMAIL          — e-mail address for SNS alert subscription
# ─────────────────────────────────────────────────────────────────────────────
name: Deploy Platform

on:
  push:
    branches: [main]
    paths:
      - 'platform/**'
  workflow_dispatch:
    inputs:
      customer_environment:
        description: 'GitHub Environment name (holds AWS credentials and config vars)'
        required: true
        type: string

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    name: Terraform Apply — Platform
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.customer_environment || 'production' }}

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: us-east-1

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.11.0

      - name: Create build directory
        run: mkdir -p platform/terraform/.build

      - name: Terraform Init
        run: |
          terraform -chdir=platform/terraform init -reconfigure \
            -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}" \
            -backend-config="key=platform/terraform.tfstate" \
            -backend-config="region=us-east-1"

      - name: Import existing resources into state
        env:
          TF_VAR_alert_email: ${{ vars.ALERT_EMAIL }}
        run: |
          set -euo pipefail

          tf_import() {
            local resource=$1 id=$2 label=$3
            if terraform -chdir=platform/terraform state list 2>/dev/null | grep -qF "$resource"; then
              echo "✓ $label already in Terraform state — skipping"
              return 0
            fi
            echo "→ Importing $label ($id) into Terraform state..."
            TF_IMPORT_OUT=$(terraform -chdir=platform/terraform import "$resource" "$id" 2>&1) \
              && echo "✓ $label imported" \
              || {
                echo "$TF_IMPORT_OUT" | grep -q "already managed" \
                  && echo "✓ $label already in state — skipping" \
                  || { echo "$TF_IMPORT_OUT" >&2; exit 1; }
              }
          }

          ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)

          # DynamoDB account registry
          TABLE="governance-platform-account-registry"
          if aws dynamodb describe-table --table-name "$TABLE" --query 'Table.TableName' --output text > /dev/null 2>&1; then
            tf_import aws_dynamodb_table.account_registry "$TABLE" "account registry table"
          fi

      - name: Terraform Plan
        run: |
          terraform -chdir=platform/terraform plan \
            -var="alert_email=${{ vars.ALERT_EMAIL }}" \
            -out=platform.tfplan

      - name: Terraform Apply
        run: terraform -chdir=platform/terraform apply -auto-approve platform.tfplan
