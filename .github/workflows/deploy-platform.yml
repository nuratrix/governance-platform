# ─────────────────────────────────────────────────────────────────────────────
# .github/workflows/deploy-platform.yml
# Deploys shared platform infrastructure (DynamoDB, SNS, Organizations data
# sources, account_registry table, OIDC role).
# Must run before any agent workflow.
#
# Required GitHub Secrets:
#   AWS_DEPLOY_ROLE_ARN  — OIDC role ARN in the governance account
#   TF_STATE_BUCKET      — S3 bucket holding all Terraform state files
#   ALERT_EMAIL          — e-mail address for SNS alert subscription
# ─────────────────────────────────────────────────────────────────────────────
name: Deploy Platform

on:
  push:
    branches: [main]
    paths:
      - 'platform/**'
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    name: Terraform Apply — Platform
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: us-east-1

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.11.0

      - name: Create build directory
        run: mkdir -p platform/terraform/.build

      - name: Terraform Init
        run: |
          terraform -chdir=platform/terraform init -reconfigure \
            -backend-config="bucket=${{ secrets.TF_STATE_BUCKET }}" \
            -backend-config="key=platform/terraform.tfstate" \
            -backend-config="region=us-east-1"

      - name: Import existing resources into state
        run: |
          # If account_registry already exists in AWS but not in Terraform state,
          # import it so apply doesn't fail trying to create a table that already exists.
          TABLE_NAME="governance-platform-account-registry"
          if aws dynamodb describe-table --table-name "$TABLE_NAME" --output text --query 'Table.TableName' 2>/dev/null; then
            if ! terraform -chdir=platform/terraform state show aws_dynamodb_table.account_registry 2>/dev/null; then
              echo "Importing existing $TABLE_NAME into Terraform state..."
              terraform -chdir=platform/terraform import aws_dynamodb_table.account_registry "$TABLE_NAME"
            else
              echo "$TABLE_NAME already in Terraform state — no import needed"
            fi
          fi

      - name: Terraform Plan
        run: |
          terraform -chdir=platform/terraform plan \
            -var="alert_email=${{ secrets.ALERT_EMAIL }}" \
            -var="platform_state_bucket=${{ secrets.TF_STATE_BUCKET }}" \
            -out=platform.tfplan

      - name: Terraform Apply
        run: terraform -chdir=platform/terraform apply -auto-approve platform.tfplan
